services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      HISTORY_DB_PATH: /data/trip_history.db
      AMAP_CACHE_DB_PATH: /data/amap_cache.db
      TRACE_DB_PATH: /data/observability.db
      USER_DB_PATH: /data/auth.db
      TASK_DB_PATH: /data/tasks.db
      TASK_WORKER_COUNT: "2"
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: atp
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
