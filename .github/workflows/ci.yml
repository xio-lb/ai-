name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: pytest 全量回归
        run: python -m pytest

  frontend:
    name: 前端构建与端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run lint

      - name: 生产构建
        run: npm run build

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # The Playwright config starts its own vite preview server, so the build
      # above has to finish first. One retry separates flaky runs from real
      # failures and leaves a trace we can inspect.
      - name: Playwright 全量回归
        run: npx playwright test --workers=2 --retries=1 --reporter=line

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
